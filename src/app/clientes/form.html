<div class="card bg-dark text-white">
  <div class="card-header">{{titulo}}</div>
  <div class="card-body">

    <form ngNativeValidate> 
      <div class="form-group row">
        <label for="nombre" class="col-form-label col-sm-2">Nombre</label>
        <div class="col-sm-6">
          <input type="text" class="form-control" [(ngModel)]="cliente.nombre" name="nombre" required> 
        </div>
      </div>

      <div class="form-group row">
        <label for="apellido" class="col-form-label col-sm-2">Apellido</label>
        <div class="col-sm-6">
          <input type="text" class="form-control" [(ngModel)]="cliente.apellido" name="apellido" required>
        </div>
      </div>

      <div class="form-group row">
        <label for="email" class="col-form-label col-sm-2">Email</label>
        <div class="col-sm-6">
          <input type="email" class="form-control" [(ngModel)]="cliente.email" name="email" required>
        </div>
      </div>

      <div class="form-group row">
        <div class="col-sm-6">
          @if (cliente.id) {
            <button class="btn btn-primary" type="button" (click)="update()" role="button">Editar</button>
          } @else {
            <button class="btn btn-primary" type="button" (click)="create()" role="button">Crear</button>
          }
        </div>
      </div>
    </form>

  </div>
</div>
