<div class="card bg-dark text-white mb-3">
  <div class="card-header">{{titulo}}</div>
  <div class="card-body">
    <form ngNativeValidate> 
      <div class="form-group row mb-3">
        <label for="codigo" class="col-sm-2 col-form-label">Código</label>
        <div class="col-sm-6">
          <input type="text" class="form-control" [(ngModel)]="articulo.codigo" name="codigo" required> 
        </div>
      </div>

      <div class="form-group row mb-3">
        <label for="nombre" class="col-sm-2 col-form-label">Nombre</label>
        <div class="col-sm-6">
          <input type="text" class="form-control" [(ngModel)]="articulo.nombre" name="nombre" required> 
        </div>
      </div>

      <div class="form-group row mb-3">
        <label for="categoria" class="col-sm-2 col-form-label">Categoría</label>
        <div class="col-sm-6">
          <input type="text" class="form-control" [(ngModel)]="articulo.categoria" name="categoria" required>
        </div>
      </div>

      <div class="form-group row mb-3">
        <label for="proveedor" class="col-sm-2 col-form-label">Proveedor</label>
        <div class="col-sm-6">
          <select class="form-select form-control" [(ngModel)]="articulo.proveedorId" name="proveedor" required>
            <option [ngValue]="undefined">--- Seleccione un proveedor ---</option>
            @for (prov of proveedores; track $index) {
              <option [ngValue]="prov.id">{{prov.nombre}}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-group row">
        <div class="col-sm-6">
          @if (articulo.id) {
            <button class="btn btn-primary" type="button" (click)="update()">Actualizar</button>
          } @else {
            <button class="btn btn-primary" type="button" (click)="create()">Crear</button>
          }
        </div>
      </div>
    </form>
  </div>
</div>
